<!doctype html>
<html lang="de" data-theme="dunkel">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Julia</title>
  <link rel="stylesheet" href="basis.css">
  <link rel="stylesheet" href="einstellungen.css">
  <script src="design.js"></script>
</head>
<body>
  <header class="einst-kopf ziehbar">
    <span class="mini-kugel gross"></span>
    <div>
      <h1 data-t="einst.titel"></h1>
      <p class="version" id="version"></p>
    </div>
  </header>

  <div class="huelle">
    <div class="such-leiste" id="suchLeiste">
      <input id="einstSuche" type="search" data-tp="einst.suche_platzhalter" autocomplete="off" spellcheck="false" aria-label="Einstellungen durchsuchen">
    </div>
    <p class="such-leer" id="suchLeer" data-t="einst.suche_leer" hidden></p>

    <section class="willkommen" id="willkommen" hidden>
      <h2 data-t="einst.einrichtung_titel"></h2>
      <p data-t="einst.einrichtung_text"></p>
    </section>

    <section class="gruppe">
      <h2 data-t="einst.allgemein"></h2>
      <div class="zwei">
        <div class="feld">
          <label for="name" data-t="einst.name"></label>
          <input id="name" data-k="nutzer.name" type="text" autocomplete="off">
        </div>
        <div class="feld">
          <label for="sprachcode" data-t="einst.sprachcode"></label>
          <select id="sprachcode" data-k="sprachcode">
            <option value="de">Deutsch</option>
            <option value="en">English</option>
          </select>
        </div>
      </div>
      <div class="zwei">
        <div class="feld">
          <label for="assistentName" data-t="einst.assistent_name"></label>
          <input id="assistentName" data-k="assistent.name" type="text" maxlength="24" autocomplete="off" spellcheck="false">
        </div>
        <div class="feld">
          <label for="assistentForm" data-t="einst.assistent_form"></label>
          <select id="assistentForm" data-k="assistent.form">
            <option value="weiblich" data-t="einst.form_weiblich"></option>
            <option value="maennlich" data-t="einst.form_maennlich"></option>
            <option value="neutral" data-t="einst.form_neutral"></option>
          </select>
        </div>
      </div>
      <div class="zwei">
        <div class="feld">
          <label for="pronomen" data-t="einst.pronomen"></label>
          <select id="pronomen" data-k="nutzer.pronomen">
            <option value="er" data-t="einst.pronomen_er"></option>
            <option value="sie" data-t="einst.pronomen_sie"></option>
            <option value="neutral" data-t="einst.pronomen_neutral"></option>
            <option value="eigene" data-t="einst.pronomen_eigene"></option>
          </select>
        </div>
        <div class="feld" id="pronomenEigenFeld" hidden>
          <label for="pronomenEigen" data-t="einst.pronomen_eigen"></label>
          <input id="pronomenEigen" data-k="nutzer.pronomen_eigen" type="text" maxlength="30" placeholder="xier/xiem" autocomplete="off">
        </div>
      </div>
      <div class="zwei">
        <div class="feld">
          <label for="anbieter" data-t="einst.anbieter"></label>
          <select id="anbieter"></select>
        </div>
        <div class="feld" id="anbieterUrlFeld" hidden>
          <label for="anbieterUrl" data-t="einst.anbieter_url"></label>
          <input id="anbieterUrl" data-k="anbieter_url" placeholder="https://…/v1" autocomplete="off" spellcheck="false">
        </div>
      </div>
      <p class="hinweis" id="anbieterHinweis" hidden></p>
      <div class="feld" id="schluesselFeld">
        <label for="schluessel" id="schluesselLabel"></label>
        <input id="schluessel" type="password" autocomplete="off" spellcheck="false">
        <small><span id="schluesselHinweis"></span> <a id="schluesselSeite" target="_blank" rel="noreferrer" data-t="einst.schluessel_holen" hidden></a></small>
      </div>
      <div class="zwei">
        <div class="feld">
          <label for="modell" data-t="einst.modell"></label>
          <input id="modell" data-k="modell" list="modelle" spellcheck="false" autocomplete="off">
          <datalist id="modelle"></datalist>
          <small><a href="#" id="modelleLaden" data-t="einst.modelle_laden"></a> <span id="modelleMeldung"></span></small>
        </div>
        <div class="feld" id="aufwandFeld">
          <label for="aufwand" data-t="einst.aufwand"></label>
          <select id="aufwand" data-k="aufwand">
            <option value="low">low</option>
            <option value="medium">medium</option>
            <option value="high">high</option>
            <option value="xhigh">xhigh</option>
            <option value="max">max</option>
          </select>
        </div>
      </div>
      <div class="feld">
        <label for="tageslimit" data-t="einst.tageslimit"></label>
        <input id="tageslimit" data-k="kosten.tageslimit_usd" data-zahl type="number" min="0" max="1000" step="0.5">
        <small id="kostenHeute"></small>
      </div>
    </section>

    <section class="gruppe">
      <h2 data-t="design.titel"></h2>
      <div class="feld">
        <label data-t="design.modus"></label>
        <div class="segment" id="modus">
          <button data-wert="dunkel" data-t="design.dunkel"></button>
          <button data-wert="hell" data-t="design.hell"></button>
          <button data-wert="system" data-t="design.system"></button>
        </div>
      </div>
      <div class="feld">
        <label data-t="design.akzent"></label>
        <div class="akzente" id="akzente"></div>
      </div>
      <label class="schalter"><input type="checkbox" data-k="design.glow"><span data-t="design.glow"></span></label>
    </section>

    <section class="gruppe">
      <h2 data-t="einst.ordner"></h2>
      <p class="hinweis" data-t="einst.ordner_hinweis"></p>
      <ul class="ordner" id="ordnerListe"></ul>
      <button class="zweit" id="ordnerHinzu" data-t="einst.ordner_hinzu"></button>
    </section>

    <section class="gruppe">
      <h2 data-t="einst.sandbox"></h2>
      <p class="hinweis" data-t="einst.sandbox_hinweis"></p>
      <label class="schalter"><input type="checkbox" data-k="sandbox.an"><span data-t="einst.sandbox_an"></span></label>
      <div class="feld">
        <label data-t="einst.sandbox_ordner"></label>
        <div class="sandbox-ordner">
          <span id="sandboxOrdner" class="pfad"></span>
          <button class="zweit" id="sandboxWaehlen" data-t="einst.sandbox_waehlen"></button>
        </div>
      </div>
    </section>

    <section class="gruppe">
      <h2 data-t="einst.lernen"></h2>
      <p class="hinweis" data-t="einst.lernen_hinweis"></p>
      <label class="schalter"><input type="checkbox" data-k="memos.an"><span data-t="einst.lernen_an"></span></label>
    </section>

    <section class="gruppe">
      <h2 data-t="einst.brainstorming"></h2>
      <p class="hinweis" data-t="einst.brainstorming_hinweis"></p>
      <label class="schalter"><input type="checkbox" data-k="brainstorming.an"><span data-t="einst.brainstorming_an"></span></label>
    </section>

    <section class="gruppe beta">
      <h2 data-t="einst.beta"></h2>
      <p class="hinweis warnung" data-t="einst.beta_warnung"></p>
      <div class="feld" id="betaBestaetigungFeld">
        <label for="betaBestaetigung" data-t="einst.beta_bestaetigung_label"></label>
        <input id="betaBestaetigung" type="text" autocomplete="off" spellcheck="false">
      </div>
      <label class="schalter"><input type="checkbox" id="betaSelbstcode" data-k="beta.selbstcode" disabled><span data-t="einst.beta_selbstcode"></span></label>
      <label class="schalter"><input type="checkbox" id="betaAgenten" data-k="beta.agenten" disabled><span data-t="einst.beta_agenten"></span></label>
      <div class="rollen-bereich" id="rollenBereich" hidden>
        <p class="hinweis" data-t="einst.rollen_hinweis"></p>
        <div class="feld schmal">
          <label for="rolleAktiv" data-t="einst.rolle_aktiv"></label>
          <select id="rolleAktiv"></select>
        </div>
        <ul class="rollen-liste" id="rollenListe"></ul>
        <details class="rollen-neu">
          <summary data-t="einst.rolle_neu"></summary>
          <div class="feld">
            <label for="rolleName" data-t="einst.rolle_name"></label>
            <input id="rolleName" maxlength="40" autocomplete="off" spellcheck="false">
          </div>
          <div class="feld">
            <label for="rolleAnweisung" data-t="einst.rolle_anweisung"></label>
            <textarea id="rolleAnweisung" rows="3" maxlength="2000" spellcheck="true"></textarea>
          </div>
          <button class="primaer klein" id="rolleHinzufuegen" data-t="einst.rolle_hinzufuegen"></button>
          <small class="konto-meldung" id="rolleMeldung"></small>
        </details>
      </div>
    </section>

    <section class="gruppe">
      <h2 data-t="einst.shell"></h2>
      <p class="hinweis" data-t="einst.shell_hinweis"></p>
      <div class="feld">
        <label for="shellTimeout" data-t="einst.shell_standard"></label>
        <input id="shellTimeout" data-k="shell.timeout_s" data-zahl type="number" min="5" max="3600" step="5">
      </div>
      <div class="feld">
        <label for="shellMax" data-t="einst.shell_max"></label>
        <input id="shellMax" data-k="shell.max_s" data-zahl type="number" min="5" max="3600" step="5">
      </div>
    </section>

    <section class="gruppe">
      <h2 data-t="einst.werkzeuge"></h2>
      <p class="hinweis" data-t="einst.werkzeuge_hinweis"></p>
      <p class="hinweis" data-t="einst.kategorien_hinweis"></p>
      <div id="kategorienListe" class="werkzeuge-liste"></div>
      <details class="werkzeug-einzeln">
        <summary data-t="einst.werkzeuge_einzeln"></summary>
        <div id="werkzeugeListe" class="werkzeuge-liste"></div>
      </details>
    </section>

    <section class="gruppe">
      <h2 data-t="einst.geheim"></h2>
      <p class="hinweis" data-t="einst.geheim_hinweis"></p>
      <ul class="geheim-liste" id="geheimListe"></ul>
      <div class="geheim-neu">
        <input id="geheimName" type="text" maxlength="80" autocomplete="off" spellcheck="false" data-tp="einst.geheim_name">
        <input id="geheimWert" type="password" autocomplete="off" data-tp="einst.geheim_wert">
        <button class="zweit" id="geheimSpeichern" data-t="einst.geheim_speichern"></button>
      </div>
    </section>

    <section class="gruppe">
      <h2 data-t="konten.titel"></h2>
      <p class="hinweis" data-t="konten.hinweis"></p>
      <div class="konto" id="kontoGoogle">
        <div class="konto-kopf">
          <span class="konto-logo">G</span>
          <div class="konto-name">
            <strong>Google</strong>
            <small id="googleStatus"></small>
          </div>
          <button class="zweit" id="googleTrennen" data-t="konten.trennen" hidden></button>
        </div>
        <div id="googleEinrichten" class="konto-einrichten">
          <p class="hinweis"><span data-t="konten.google_text"></span> <a id="googleAnleitung" target="_blank" rel="noreferrer" data-t="konten.anleitung"></a></p>
          <div class="zwei">
            <div class="feld">
              <label for="googleClientId" data-t="konten.client_id"></label>
              <input id="googleClientId" spellcheck="false" autocomplete="off" placeholder="…apps.googleusercontent.com">
            </div>
            <div class="feld">
              <label for="googleClientSecret" data-t="konten.client_secret"></label>
              <input id="googleClientSecret" type="password" spellcheck="false" autocomplete="off">
              <small id="googleSecretHinweis"></small>
            </div>
          </div>
          <button class="primaer klein" id="googleVerbinden" data-t="konten.verbinden"></button>
          <small class="konto-meldung" id="googleMeldung"></small>
        </div>
      </div>

      <div class="konto" id="kontoOutlook">
        <div class="konto-kopf">
          <span class="konto-logo">O</span>
          <div class="konto-name">
            <strong>Outlook</strong>
            <small id="outlookStatus"></small>
          </div>
          <button class="zweit" id="outlookTrennen" data-t="konten.trennen" hidden></button>
        </div>
        <div id="outlookEinrichten" class="konto-einrichten">
          <p class="hinweis"><span id="outlookText"></span> <a id="outlookAnleitung" target="_blank" rel="noreferrer" data-t="konten.anleitung"></a> <a href="#" id="outlookEigeneId" data-t="konten.outlook_eigene_id" hidden></a></p>
          <div class="feld" id="outlookIdFeld">
            <label for="outlookClientId" data-t="konten.outlook_client_id"></label>
            <input id="outlookClientId" spellcheck="false" autocomplete="off" placeholder="1a2b3c4d-1234-…">
          </div>
          <button class="primaer klein" id="outlookVerbinden" data-t="konten.outlook_verbinden"></button>
          <small class="konto-meldung" id="outlookMeldung"></small>
        </div>
      </div>

      <div class="konto" id="kontoSync">
        <div class="konto-kopf">
          <span class="konto-logo" aria-hidden="true">⇄</span>
          <div class="konto-name">
            <strong data-t="sync.titel"></strong>
            <small id="syncStatus"></small>
          </div>
        </div>
        <div class="konto-einrichten">
          <p class="hinweis" data-t="sync.text"></p>
          <label class="schalter"><input type="checkbox" id="syncAn" data-k="sync.an"><span data-t="sync.an"></span></label>
          <div id="syncBereich" hidden>
            <p class="hinweis" data-t="sync.firewall"></p>
            <ul class="sync-geraete" id="syncGeraete"></ul>
            <div class="sync-knoepfe">
              <button class="primaer klein" id="syncCodeZeigen" data-t="sync.code_zeigen"></button>
              <button class="zweit" id="syncCodeEingeben" data-t="sync.code_eingeben"></button>
              <button class="zweit" id="syncJetzt" data-t="sync.jetzt"></button>
            </div>
            <div class="sync-code" id="syncCodeBox" hidden>
              <p class="hinweis" data-t="sync.code_hinweis"></p>
              <strong id="syncCode"></strong>
            </div>
            <div id="syncEingabeBox" hidden>
              <div class="zwei">
                <div class="feld">
                  <label for="syncCodeFeld" data-t="sync.code"></label>
                  <input id="syncCodeFeld" maxlength="20" spellcheck="false" autocomplete="off" placeholder="XXXX-XXXX-XXXX">
                </div>
                <div class="feld">
                  <label for="syncAdresseFeld" data-t="sync.adresse"></label>
                  <input id="syncAdresseFeld" maxlength="60" spellcheck="false" autocomplete="off" placeholder="192.168.1.20">
                </div>
              </div>
              <button class="primaer klein" id="syncVerbinden" data-t="sync.verbinden"></button>
            </div>
            <small class="konto-meldung" id="syncMeldung"></small>
            <small class="hinweis" id="syncAdressen"></small>
          </div>
          <div class="feld schmal">
            <label for="syncPort" data-t="sync.port"></label>
            <input id="syncPort" data-k="sync.port" data-zahl inputmode="numeric" spellcheck="false" autocomplete="off">
          </div>
        </div>
      </div>

      <div class="konto" id="kontoApp">
        <div class="konto-kopf">
          <span class="konto-logo" aria-hidden="true">📲</span>
          <div class="konto-name">
            <strong data-t="app.titel"></strong>
            <small id="appStatus"></small>
          </div>
          <button class="zweit" id="appTrennen" data-t="konten.trennen" hidden></button>
        </div>
        <div class="konto-einrichten">
          <p class="hinweis" data-t="app.text"></p>
          <label class="schalter"><input type="checkbox" id="appAn" data-k="appserver.an"><span data-t="app.an"></span></label>
          <div id="appBereich" hidden>
            <p class="hinweis" data-t="handy.firewall" style="display:none"></p>
            <small class="hinweis" id="appAdressen"></small>
            <button class="primaer klein" id="appKoppeln" data-t="app.koppeln"></button>
            <div class="sync-code" id="appCodeBox" hidden>
              <p class="hinweis" data-t="app.code_hinweis"></p>
              <strong id="appCode"></strong>
            </div>
            <small class="konto-meldung" id="appMeldung"></small>
          </div>
          <div class="feld schmal">
            <label for="appPort" data-t="sync.port"></label>
            <input id="appPort" data-k="appserver.port" data-zahl inputmode="numeric" spellcheck="false" autocomplete="off">
          </div>
        </div>
      </div>

      <div class="konto" id="kontoMcp">
        <div class="konto-kopf">
          <span class="konto-logo" aria-hidden="true">⧉</span>
          <div class="konto-name">
            <strong data-t="mcp.titel"></strong>
            <small id="mcpStatus"></small>
          </div>
        </div>
        <div class="konto-einrichten">
          <p class="hinweis" data-t="mcp.text"></p>
          <div id="mcpDrop" class="mcp-drop">
            <span data-t="mcp.drop"></span>
            <input id="mcpDatei" type="file" accept="application/json,.json" hidden>
          </div>
          <small class="konto-meldung" id="mcpImportMeldung"></small>
          <ul class="mcp-liste" id="mcpListe"></ul>
          <details class="mcp-neu">
            <summary data-t="mcp.hinzufuegen"></summary>
            <div class="zwei">
              <div class="feld">
                <label for="mcpName" data-t="mcp.name"></label>
                <input id="mcpName" maxlength="40" spellcheck="false" autocomplete="off" placeholder="GitHub">
              </div>
              <div class="feld">
                <label for="mcpArt" data-t="mcp.art"></label>
                <select id="mcpArt">
                  <option value="stdio" data-t="mcp.art_stdio"></option>
                  <option value="http" data-t="mcp.art_http"></option>
                </select>
              </div>
            </div>
            <div class="feld" id="mcpBefehlFeld">
              <label for="mcpBefehl" data-t="mcp.befehl"></label>
              <input id="mcpBefehl" maxlength="1000" spellcheck="false" autocomplete="off" placeholder="npx -y @modelcontextprotocol/server-filesystem C:\Users\du\Dokumente">
            </div>
            <div class="feld" id="mcpUrlFeld" hidden>
              <label for="mcpUrl" data-t="mcp.url"></label>
              <input id="mcpUrl" maxlength="500" spellcheck="false" autocomplete="off" placeholder="https://mcp.example.com/mcp">
            </div>
            <div class="feld">
              <label for="mcpUmgebung" id="mcpUmgebungLabel" data-t="mcp.umgebung"></label>
              <textarea id="mcpUmgebung" rows="2" spellcheck="false" autocomplete="off" placeholder="GITHUB_PERSONAL_ACCESS_TOKEN=…"></textarea>
              <small data-t="mcp.umgebung_hinweis"></small>
            </div>
            <label class="schalter"><input type="checkbox" id="mcpVertraut"><span data-t="mcp.vertraut"></span></label>
            <button class="primaer klein" id="mcpHinzufuegen" data-t="mcp.hinzufuegen_knopf"></button>
            <small class="konto-meldung" id="mcpMeldung"></small>
          </details>
        </div>
      </div>
    </section>

    <section class="gruppe">
      <h2 data-t="einst.sprache"></h2>
      <div class="zwei">
        <div class="feld">
          <label for="hkSprechen" data-t="einst.hotkey_sprechen"></label>
          <input id="hkSprechen" data-k="hotkey.sprechen" spellcheck="false">
        </div>
        <div class="feld">
          <label for="hkChat" data-t="einst.hotkey_chat"></label>
          <input id="hkChat" data-k="hotkey.chat" spellcheck="false">
        </div>
      </div>
      <div class="zwei">
        <div class="feld">
          <label for="hkAuswahl" data-t="einst.hotkey_auswahl"></label>
          <input id="hkAuswahl" data-k="hotkey.auswahl" spellcheck="false" placeholder="Control+Alt+T">
        </div>
      </div>
      <div class="zwei">
        <div class="feld">
          <label for="vorlesen" data-t="einst.vorlesen"></label>
          <select id="vorlesen" data-k="sprache.vorlesen">
            <option value="bei-sprache" data-t="einst.vorlesen_bei"></option>
            <option value="immer" data-t="einst.vorlesen_immer"></option>
            <option value="nie" data-t="einst.vorlesen_nie"></option>
          </select>
        </div>
        <div class="feld">
          <label for="stimme" data-t="einst.stimme"></label>
          <select id="stimme" data-k="sprache.stimme"></select>
        </div>
      </div>
      <div class="lade-zeile" id="piperZeile" hidden>
        <small id="piperStatus" aria-live="polite"></small>
        <button class="zweit" id="piperLaden" hidden></button>
      </div>
      <div class="zwei">
        <div class="feld">
          <label for="mikrofon" data-t="einst.mikrofon"></label>
          <select id="mikrofon" data-k="sprache.mikrofon"></select>
        </div>
        <div class="feld">
          <label for="lautsprecher" data-t="einst.lautsprecher"></label>
          <select id="lautsprecher" data-k="sprache.lautsprecher"></select>
        </div>
      </div>
      <div class="zwei">
        <div class="feld">
          <label for="erkennung" data-t="whisper.erkennung"></label>
          <select id="erkennung" data-k="sprache.erkennung">
            <option value="whisper" data-t="whisper.erkennung_whisper"></option>
            <option value="windows" data-t="whisper.erkennung_windows"></option>
          </select>
        </div>
        <div class="feld">
          <label for="whisperModell" data-t="whisper.modell"></label>
          <select id="whisperModell" data-k="sprache.whisper_modell">
            <option value="genau" data-t="whisper.modell_genau"></option>
            <option value="schnell" data-t="whisper.modell_schnell"></option>
          </select>
        </div>
      </div>
      <div class="lade-zeile">
        <small id="whisperStatus" aria-live="polite"></small>
        <button class="zweit" id="whisperLaden" hidden></button>
      </div>
      <div class="knopfreihe">
        <button class="zweit" id="stimmeTesten" data-t="einst.testen"></button>
        <button class="zweit" id="mikroTesten" data-t="mikrotest.knopf"></button>
        <small id="audioHinweis"></small>
      </div>
      <div class="mikrotest" id="mikroTest" hidden>
        <p class="mikrotest-status" id="mikroTestStatus" aria-live="polite"></p>
        <ul class="mikrotest-diagnose" id="mikroDiagnose"></ul>
        <pre class="mikrotest-bericht" id="mikroBericht"></pre>
        <button class="zweit" id="mikroKopieren" data-t="mikrotest.kopieren" hidden></button>
      </div>
      <div class="regler">
        <label for="sprechtempo" data-t="einst.sprechtempo"></label>
        <input type="range" id="sprechtempo" data-k="sprache.tempo" data-zahl min="-10" max="10" step="1">
        <output></output>
      </div>
      <div class="regler">
        <label for="sprechpause" data-t="einst.sprechpause"></label>
        <input type="range" id="sprechpause" data-k="sprache.pause_s" data-zahl min="0.5" max="5" step="0.1">
        <output></output>
      </div>
      <p class="hinweis" data-t="einst.sprechpause_hinweis"></p>
      <label class="schalter"><input type="checkbox" data-k="weckwort.an"><span data-t="einst.weckwort"></span></label>
      <p class="hinweis" data-t="einst.weckwort_hinweis"></p>
      <div class="feld">
        <label for="weckwortPhrasen" data-t="einst.weckwort_phrasen"></label>
        <textarea id="weckwortPhrasen" data-k="weckwort.phrasen" rows="3" spellcheck="false" autocomplete="off"></textarea>
        <small data-t="einst.weckwort_phrasen_hinweis"></small>
      </div>
      <div class="regler">
        <label for="weckwortSchwelle" data-t="einst.weckwort_schwelle"></label>
        <input type="range" id="weckwortSchwelle" data-k="weckwort.schwelle" data-zahl min="0.6" max="0.95" step="0.05">
        <output></output>
      </div>
    </section>

    <section class="gruppe">
      <h2 data-t="einst.blase"></h2>
      <label class="schalter"><input type="checkbox" data-k="blase.an"><span data-t="einst.blase_an"></span></label>
      <label class="schalter"><input type="checkbox" data-k="blase.untertitel"><span data-t="einst.blase_untertitel"></span></label>
      <p class="hinweis"><span data-t="einst.blase_zieh_hinweis"></span> <a href="#" id="blasePosition" data-t="einst.blase_position"></a></p>
      <div class="zwei">
        <div class="feld">
          <label for="monitor" data-t="einst.monitor"></label>
          <select id="monitor" data-k="blase.monitor" data-zahl></select>
        </div>
        <div class="feld">
          <label for="ecke" data-t="einst.ecke"></label>
          <select id="ecke" data-k="blase.ecke">
            <option value="unten-rechts" data-t="ecke.unten-rechts"></option>
            <option value="unten-links" data-t="ecke.unten-links"></option>
            <option value="oben-rechts" data-t="ecke.oben-rechts"></option>
            <option value="oben-links" data-t="ecke.oben-links"></option>
          </select>
        </div>
      </div>
      <div class="regler">
        <label data-t="einst.groesse"></label>
        <input type="range" data-k="blase.groesse" data-zahl data-live min="120" max="900" step="10">
        <output></output>
      </div>
      <div class="regler">
        <label data-t="einst.deckkraft"></label>
        <input type="range" data-k="blase.deckkraft" data-zahl data-live min="0.1" max="1" step="0.05">
        <output></output>
      </div>
      <div class="regler">
        <label data-t="einst.tempo"></label>
        <input type="range" data-k="blase.tempo" data-zahl data-live min="0" max="3" step="0.1">
        <output></output>
      </div>
      <div class="regler">
        <label data-t="einst.empfindlichkeit"></label>
        <input type="range" data-k="blase.empfindlichkeit" data-zahl data-live min="0" max="3" step="0.1">
        <output></output>
      </div>
      <h3 data-t="einst.farben"></h3>
      <div class="farben" id="farben"></div>
      <div class="knopfreihe">
        <button class="zweit" id="standardfarben" data-t="einst.standardfarben"></button>
        <button class="zweit" id="blaseAkzent" data-t="design.blase_akzent"></button>
      </div>
    </section>

    <section class="gruppe">
      <h2 data-t="einst.overlay"></h2>
      <p class="hinweis" data-t="einst.overlay_hinweis"></p>
      <label class="schalter"><input type="checkbox" data-k="overlay.automatisch"><span data-t="einst.overlay_auto"></span></label>
      <label class="schalter"><input type="checkbox" data-k="overlay.immer"><span data-t="einst.overlay_immer"></span></label>
      <div class="feld">
        <label for="overlaySpiele" data-t="einst.overlay_spiele"></label>
        <textarea id="overlaySpiele" data-k="overlay.spiele" rows="2" spellcheck="false" autocomplete="off" placeholder="valorant&#10;eldenring"></textarea>
        <small data-t="einst.overlay_spiele_hinweis"></small>
      </div>
      <div class="zwei">
        <div class="feld">
          <label for="hkOverlay" data-t="einst.hotkey_overlay"></label>
          <input id="hkOverlay" data-k="hotkey.overlay" spellcheck="false" placeholder="Control+Shift+Space">
        </div>
        <div class="feld">
          <label for="overlayAntwort" data-t="einst.overlay_bei_antwort"></label>
          <select id="overlayAntwort" data-k="overlay.bei_antwort">
            <option value="aus" data-t="einst.overlay_aus"></option>
            <option value="passiv" data-t="einst.overlay_passiv"></option>
          </select>
        </div>
      </div>
      <div class="zwei">
        <div class="feld">
          <label for="overlayMonitor" data-t="einst.monitor"></label>
          <select id="overlayMonitor" data-k="overlay.monitor" data-zahl></select>
        </div>
        <div class="feld">
          <label for="overlayEcke" data-t="einst.ecke"></label>
          <select id="overlayEcke" data-k="overlay.ecke">
            <option value="oben-rechts" data-t="ecke.oben-rechts"></option>
            <option value="oben-links" data-t="ecke.oben-links"></option>
            <option value="unten-rechts" data-t="ecke.unten-rechts"></option>
            <option value="unten-links" data-t="ecke.unten-links"></option>
          </select>
        </div>
      </div>
      <div class="regler">
        <label data-t="einst.overlay_deckkraft"></label>
        <input type="range" data-k="overlay.deckkraft" data-zahl data-live min="0.3" max="1" step="0.02">
        <output></output>
      </div>
      <div class="regler">
        <label data-t="einst.overlay_hintergrund"></label>
        <input type="range" data-k="overlay.hintergrund" data-zahl data-live min="0" max="1" step="0.02">
        <output></output>
      </div>
      <div class="regler">
        <label data-t="einst.overlay_breite"></label>
        <input type="range" data-k="overlay.breite" data-zahl data-live min="280" max="720" step="10">
        <output></output>
      </div>
      <div class="regler">
        <label data-t="einst.overlay_hoehe"></label>
        <input type="range" data-k="overlay.hoehe" data-zahl data-live min="240" max="1000" step="10">
        <output></output>
      </div>
      <div class="regler">
        <label data-t="einst.overlay_schrift"></label>
        <input type="range" data-k="overlay.schrift" data-zahl data-live min="11" max="18" step="1">
        <output></output>
      </div>
      <div class="regler">
        <label data-t="einst.overlay_ausblenden"></label>
        <input type="range" data-k="overlay.ausblenden" data-zahl min="4" max="60" step="1">
        <output></output>
      </div>
      <label class="schalter"><input type="checkbox" data-k="overlay.kompakt"><span data-t="einst.overlay_kompakt"></span></label>
      <p class="hinweis" data-t="einst.overlay_ziehen"></p>
      <div class="knopfreihe">
        <button class="zweit" id="overlayVorschau" data-t="einst.overlay_vorschau"></button>
        <button class="zweit" id="overlayPositionWeg" data-t="einst.overlay_position_weg"></button>
      </div>
    </section>

    <section class="gruppe">
      <h2 data-t="einst.clips"></h2>
      <p class="hinweis" data-t="einst.clips_hinweis"></p>
      <div class="zwei">
        <div class="feld">
          <label for="clipMethode" data-t="einst.clip_methode"></label>
          <select id="clipMethode" data-k="clip.methode">
            <option value="gamebar" data-t="clip.m_gamebar"></option>
            <option value="nvidia" data-t="clip.m_nvidia"></option>
            <option value="amd" data-t="clip.m_amd"></option>
            <option value="eigen" data-t="clip.m_eigen"></option>
          </select>
        </div>
        <div class="feld">
          <label for="hkClip" data-t="einst.hotkey_clip"></label>
          <input id="hkClip" data-k="hotkey.clip" spellcheck="false" placeholder="Control+Alt+C">
        </div>
      </div>
      <div class="zwei">
        <div class="feld">
          <label for="clipTaste" data-t="einst.clip_taste"></label>
          <input id="clipTaste" data-k="clip.taste" spellcheck="false" placeholder="Alt+F10">
        </div>
        <div class="feld">
          <label for="clipOrdner" data-t="einst.clip_ordner"></label>
          <input id="clipOrdner" data-k="clip.ordner" spellcheck="false" placeholder="C:\Users\…\Videos\Captures">
        </div>
      </div>
    </section>

    <section class="gruppe">
      <h2 data-t="einst.freigaben"></h2>
      <label class="schalter"><input type="checkbox" id="freigabeImmer" data-k="freigabe.immer"><span data-t="einst.freigabe_immer"></span></label>
      <label class="schalter"><input type="checkbox" id="freigabeFremd" data-k="freigabe.fremd"><span data-t="einst.freigabe_fremd"></span></label>
      <p class="hinweis" data-t="einst.freigabe_hinweis"></p>
    </section>

    <section class="gruppe">
      <h2 data-t="einst.system"></h2>
      <label class="schalter"><input type="checkbox" data-k="erinnerung.vorlesen"><span data-t="einst.erinnerung_vorlesen"></span></label>
      <label class="schalter"><input type="checkbox" data-k="verlauf.speichern"><span data-t="einst.verlauf_speichern"></span></label>
      <label class="schalter"><input type="checkbox" data-k="autostart"><span data-t="einst.autostart"></span></label>
      <label class="schalter"><input type="checkbox" data-k="update.pruefen"><span data-t="einst.update_pruefen"></span></label>
      <label class="schalter"><input type="checkbox" data-k="update.automatisch"><span data-t="einst.update_auto"></span></label>
      <div class="feld" id="defenderFeld" hidden>
        <span class="rep-status" id="defenderStatus"></span>
        <button class="zweit" id="defenderKnopf" data-t="einst.defender_knopf"></button>
        <p class="hinweis" data-t="einst.defender_hinweis"></p>
      </div>
      <div class="feld" id="reparaturFeld">
        <span class="rep-status" id="reparaturStatus"></span>
        <button class="zweit" id="reparaturKnopf"></button>
        <p class="hinweis rep-treiber" id="reparaturTreiber" hidden></p>
        <p class="hinweis" data-t="einst.reparatur_hinweis"></p>
      </div>
      <div class="feld schmal">
        <label for="kanal" data-t="einst.update_kanal"></label>
        <select id="kanal" data-k="update.kanal">
          <option value="stabil" data-t="einst.kanal_stabil"></option>
          <option value="test" data-t="einst.kanal_test"></option>
        </select>
      </div>
    </section>
  </div>

  <footer class="einst-fuss">
    <span id="meldung"></span>
    <button class="primaer" id="speichern"></button>
  </footer>

  <script src="suche.js"></script>
  <script src="einstellungen.js"></script>
</body>
</html>
