# Von VibeWorks angelegt: kostenloser Repo-Check ohne KI – Geheimnisse (Gitleaks),
# Sicherheitslücken (OSV-Scanner), Fehlermuster (Semgrep), je Sprache Bandit, ShellCheck,
# Hadolint, actionlint und fallow (JS/TS) sowie offene Stellen (TODO/FIXME).
# Das Ergebnis liegt als Artefakt „vibeworks-check“ bereit, VibeWorks holt es selbst ab.
# Datei löschen = Check aus.
name: VibeWorks Repo-Check

on:
  # Bei jedem Code-Commit auf dem Hauptzweig und in Pull Requests – reiner
  # Text (Doku, Lizenz) löst nichts aus. Der Check schreibt nichts zurück,
  # es kann sich also nichts aufschaukeln.
  push:
    branches: ["main", "master"]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE", ".gitignore"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "LICENSE", ".gitignore"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Je Zweig eine Reihe – ein Pull Request bricht den Lauf auf main nicht ab
  group: vibeworks-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          # Die Prüf-Container sehen das Repository – aber nicht das Token in .git/config
          persist-credentials: false

      # Ein abgebrochenes Werkzeug darf nicht wie ein sauberer Lauf aussehen (#149):
      # jeder Schritt schreibt seinen Fehler in .vw-errors.txt, das landet im Bericht.
      - name: Geheimnisse (Gitleaks)
        id: gitleaks
        continue-on-error: true
        run: >-
          docker run --rm -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*'
          zricethezav/gitleaks:v8.30.1 detect --source /repo --no-banner --redact
          --report-format json --report-path /repo/.vw-gitleaks.json --exit-code 0

      - name: Sicherheitslücken (OSV-Scanner)
        id: osv
        continue-on-error: true
        run: >-
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.6.0
          scan source --recursive --format json --output-file /src/.vw-osv.json /src

      - name: Fehlermuster (Semgrep)
        id: semgrep
        continue-on-error: true
        run: >-
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.177.0
          semgrep scan --config p/default --json --metrics off --quiet --output /src/.vw-semgrep.json

      - name: Offene Stellen (TODO/FIXME)
        id: todos
        continue-on-error: true
        # Nur Kommentare (// # /* * -- <!--) – nicht jedes Wort „TODO“ im Code
        run: |
          git grep -n -I -E '(//|#|/\*|\*|--|<!--)[[:space:]]*(TODO|FIXME|HACK|XXX)\b' -- ':!*.lock' ':!package-lock.json' ':!.github/workflows/vibeworks-check.yml' > .vw-todos.txt || true

      - name: Sprachwerkzeuge (Bandit, ShellCheck, Hadolint, actionlint, fallow)
        id: languages
        continue-on-error: true
        # Nur was im Repository vorkommt – je Sprache ein kostenloses Werkzeug
        run: |
          if git ls-files '*.py' | grep -q .; then
            pipx run bandit -r . -q -f json -o .vw-bandit.json --exit-zero || true
          fi
          if git ls-files '*.sh' '*.bash' | grep -q .; then
            git ls-files -z '*.sh' '*.bash' | xargs -0 shellcheck -f json > .vw-shellcheck.json || true
          fi
          i=0
          git ls-files '*Dockerfile*' '*.dockerfile' | head -20 | while IFS= read -r f; do
            i=$((i + 1))
            printf '%s\n' "$f" >> .vw-hadolint-files.txt
            docker run --rm -i hadolint/hadolint:v2.15.1 hadolint -f json - < "$f" > ".vw-hadolint-$i.json" || true
          done
          if git ls-files '.github/workflows/*.yml' '.github/workflows/*.yaml' | grep -q .; then
            docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -format '{{json .}}' > .vw-actionlint.json || true
          fi
          # JavaScript/TypeScript: ungenutzter Code, ungenutzte Abhängigkeiten, Zyklen (fallow, kostenlos).
          # Feste Version und – falls vorhanden – dieselbe Baseline wie das Projekt selbst,
          # damit Repo-Check und eigene Prüfung nicht auseinanderlaufen.
          if [ -f package.json ] && git ls-files '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' | grep -q .; then
            if [ -f .fallow-baseline.json ]; then
              npx -y fallow@3.28.0 dead-code --baseline .fallow-baseline.json --format json > .vw-fallow.json 2> /dev/null || true
            else
              npx -y fallow@3.28.0 dead-code --format json > .vw-fallow.json 2> /dev/null || true
            fi
          fi

      - name: Zusammenfassen
        env:
          # Ergebnis jedes Prüfschritts – „failure“ heißt: das Werkzeug ist
          # abgebrochen, sein Teil des Berichts fehlt (#149)
          VW_OUTCOMES: '{"gitleaks": "${{ steps.gitleaks.outcome }}", "osv": "${{ steps.osv.outcome }}", "semgrep": "${{ steps.semgrep.outcome }}", "todos": "${{ steps.todos.outcome }}", "languages": "${{ steps.languages.outcome }}"}'
        run: |
          python3 - <<'PY'
          import datetime, json, os

          def load(path):
              try:
                  with open(path, encoding="utf-8") as f:
                      return json.load(f)
              except Exception:
                  return None

          out = {
              "version": 1,
              "commit": os.environ.get("GITHUB_SHA", ""),
              "finishedAt": datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "tools": {},
              "secrets": [],
              "vulnerabilities": [],
              "findings": [],
              "todos": [],
              "toolErrors": [],
          }

          # Abgebrochene Schritte melden – sonst sieht ein kaputtes Werkzeug aus
          # wie ein sauberer Lauf (#149)
          STEP_LABEL = {"gitleaks": "Gitleaks", "osv": "OSV-Scanner", "semgrep": "Semgrep", "todos": "TODO-Suche", "languages": "Sprachwerkzeuge"}
          try:
              outcomes = json.loads(os.environ.get("VW_OUTCOMES") or "{}")
          except Exception:
              outcomes = {}
          for key, outcome in outcomes.items():
              if outcome in ("failure", "cancelled"):
                  out["toolErrors"].append({"tool": key, "message": f"{STEP_LABEL.get(key, key)}: Schritt abgebrochen ({outcome}) – die Ergebnisse fehlen"})

          leaks = load(".vw-gitleaks.json")
          out["tools"]["gitleaks"] = leaks is not None
          for x in (leaks or [])[:200]:
              out["secrets"].append({"file": x.get("File"), "line": x.get("StartLine"), "rule": x.get("RuleID"), "description": x.get("Description"), "commit": (x.get("Commit") or "")[:12]})

          osv = load(".vw-osv.json")
          out["tools"]["osv"] = osv is not None
          for result in (osv or {}).get("results") or []:
              source = (result.get("source") or {}).get("path", "").replace("/src/", "", 1)
              for p in result.get("packages") or []:
                  pkg = p.get("package") or {}
                  severity = {}
                  for group in p.get("groups") or []:
                      for vid in group.get("ids") or []:
                          severity[vid] = group.get("max_severity") or ""
                  for v in p.get("vulnerabilities") or []:
                      out["vulnerabilities"].append({"package": pkg.get("name"), "version": pkg.get("version"), "ecosystem": pkg.get("ecosystem"), "id": v.get("id"), "summary": (v.get("summary") or "")[:200], "severity": severity.get(v.get("id"), ""), "source": source})
          out["vulnerabilities"] = out["vulnerabilities"][:300]

          semgrep = load(".vw-semgrep.json")
          out["tools"]["semgrep"] = semgrep is not None
          for x in ((semgrep or {}).get("results") or [])[:300]:
              extra = x.get("extra") or {}
              out["findings"].append({"file": x.get("path"), "line": (x.get("start") or {}).get("line"), "rule": x.get("check_id"), "severity": extra.get("severity"), "message": (extra.get("message") or "")[:300]})

          try:
              with open(".vw-todos.txt", encoding="utf-8", errors="replace") as f:
                  for line in f:
                      parts = line.rstrip("\n").split(":", 2)
                      if len(parts) == 3 and parts[1].isdigit():
                          out["todos"].append({"file": parts[0], "line": int(parts[1]), "text": parts[2].strip()[:200]})
                      if len(out["todos"]) >= 300:
                          break
              out["tools"]["todos"] = True
          except Exception:
              out["tools"]["todos"] = False

          # Sprachwerkzeuge: als Befunde mit Werkzeug im Regelnamen, zusammen höchstens 100
          extra = []
          def add(tool, file, line, rule, severity, message):
              if len(extra) < 100:
                  extra.append({"file": (file or "").removeprefix("./"), "line": line if isinstance(line, int) else None, "rule": f"{tool}:{rule}", "severity": severity, "message": (message or "")[:300]})

          bandit = load(".vw-bandit.json")
          if bandit is not None:
              out["tools"]["bandit"] = True
              for x in (bandit.get("results") or []):
                  add("bandit", x.get("filename"), x.get("line_number"), x.get("test_id"), {"HIGH": "ERROR", "MEDIUM": "WARNING"}.get(x.get("issue_severity"), "INFO"), x.get("issue_text"))

          shellcheck = load(".vw-shellcheck.json")
          if shellcheck is not None:
              out["tools"]["shellcheck"] = True
              for x in shellcheck:
                  add("shellcheck", x.get("file"), x.get("line"), f"SC{x.get('code')}", {"error": "ERROR", "warning": "WARNING"}.get(x.get("level"), "INFO"), x.get("message"))

          try:
              with open(".vw-hadolint-files.txt", encoding="utf-8") as f:
                  docker_files = [l.rstrip("\n") for l in f]
          except Exception:
              docker_files = []
          for n, name in enumerate(docker_files, start=1):
              data = load(f".vw-hadolint-{n}.json")
              if data is None:
                  continue
              out["tools"]["hadolint"] = True
              for x in data:
                  add("hadolint", name, x.get("line"), x.get("code"), {"error": "ERROR", "warning": "WARNING"}.get(x.get("level"), "INFO"), x.get("message"))

          actionlint = load(".vw-actionlint.json")
          if actionlint is not None:
              out["tools"]["actionlint"] = True
              for x in actionlint:
                  add("actionlint", x.get("filepath"), x.get("line"), x.get("kind"), "WARNING", x.get("message"))

          fallow = load(".vw-fallow.json")
          if fallow is not None:
              out["tools"]["fallow"] = True
              for x in (fallow.get("unused_dependencies") or [])[:15]:
                  add("fallow", x.get("path") or "package.json", x.get("line"), "unused-dependency", "WARNING", f"Dependency {x.get('package_name')} is not used")
              for x in (fallow.get("circular_dependencies") or [])[:10]:
                  files = x.get("files") or []
                  add("fallow", files[0] if files else "", x.get("line"), "circular", "WARNING", "Import cycle: " + " -> ".join(files[:6]))
              for x in (fallow.get("unused_files") or [])[:15]:
                  add("fallow", x.get("path"), None, "unused-file", "INFO", "File is not imported anywhere")
              for x in (fallow.get("unused_exports") or [])[:15]:
                  add("fallow", x.get("path"), x.get("line"), "unused-export", "INFO", f"Export {x.get('export_name')} is not used")

          out["findings"] = extra + out["findings"][: 400 - len(extra)]

          out["counts"] = {k: len(out[k]) for k in ("secrets", "vulnerabilities", "findings", "todos")}
          with open("vibeworks-check.json", "w", encoding="utf-8") as f:
              json.dump(out, f)
          print(json.dumps(out["counts"]))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vibeworks-check
          path: vibeworks-check.json
          retention-days: 14
