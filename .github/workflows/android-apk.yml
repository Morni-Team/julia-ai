name: Android-APK bauen

# Baut eine installierbare Android-APK für die Handy-App (julia-android) direkt in
# GitHub Actions – komplett ohne Expo-Konto oder EAS-Cloud. Über `expo prebuild`
# wird das native Android-Projekt erzeugt und mit Gradle eine debug-signierte APK
# gebaut, die man direkt aufs Handy laden und installieren kann.
#
# Auslöser:
#   - AUTOMATISCH bei jedem Push auf `main`, der die Handy-App (julia-android)
#     oder diesen Workflow betrifft → so entsteht ohne Zutun immer eine frische APK
#   - manuell (Actions-Tab → „Android-APK bauen" → Run workflow)
#   - beim Pushen eines Tags, der mit `android-v` beginnt (z. B. android-v0.1.0)
# Ergebnis:
#   - die APK hängt als Artefakt am Lauf (immer herunterladbar)
#   - zusätzlich wird das Release `android-latest` aktualisiert, damit es einen
#     festen Download-Link gibt.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'android-v*'
    paths:
      - 'julia-android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: julia-android
    steps:
      - name: Quellcode holen
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Node einrichten
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'

      - name: Java (JDK 17) einrichten
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Abhängigkeiten installieren
        # `npm ci` statt `npm install`: installiert exakt die Versionen aus
        # package-lock.json → reproduzierbare Builds. Ohne Lockdatei löste
        # `npm install` bei jedem Lauf frisch auf, wodurch ein neueres
        # Transitiv-Paket den Build sporadisch brechen konnte (Issue #6).
        run: npm ci

      - name: Natives Android-Projekt erzeugen (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Splash-Farbe absichern (fehlt sonst je nach Expo-Version)
        # Das prebuild-Template verweist in res/drawable/splashscreen.xml auf
        # @color/splashscreen_background, erzeugt die Farbe aber nicht immer –
        # dann bricht der Ressourcen-Schritt ab. Wir legen sie sicher an.
        run: |
          farben=android/app/src/main/res/values/colors.xml
          if [ -f "$farben" ]; then
            grep -q 'splashscreen_background' "$farben" || \
              sed -i 's|</resources>|    <color name="splashscreen_background">#ffffff</color>\n</resources>|' "$farben"
          else
            mkdir -p android/app/src/main/res/values
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="splashscreen_background">#ffffff</color>\n</resources>\n' > "$farben"
          fi

      - name: APK bauen (Gradle, debug-signiert = direkt installierbar)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: APK-Pfad bestimmen
        id: apk
        run: |
          pfad=$(find android/app/build/outputs/apk -name '*.apk' | head -n1)
          echo "Gefundene APK: $pfad"
          cp "$pfad" "$GITHUB_WORKSPACE/Julia.apk"
          echo "datei=$GITHUB_WORKSPACE/Julia.apk" >> "$GITHUB_OUTPUT"

      - name: APK als Artefakt anhängen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Julia-Android-APK
          path: ${{ steps.apk.outputs.datei }}

      - name: Release „android-latest" aktualisieren
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE"
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest Julia.apk --clobber
          else
            gh release create android-latest Julia.apk \
              --title 'Julia für Android (aktuelle APK)' \
              --notes 'Automatisch gebaute, installierbare Android-APK der Handy-App. Auf dem Handy herunterladen, Installation aus unbekannter Quelle erlauben, dann öffnen. Diese Datei wird bei jedem Build hier aktualisiert.'
          fi
